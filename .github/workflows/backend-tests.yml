name: Backend regression tests

on:
  push:
    branches: [main, "fix/health-scanner-stability"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Check frontend JavaScript syntax
        run: |
          node --check script.js
          node --check backend/www/script.js
      - name: Run API regression tests
        working-directory: backend
        env:
          SECRET_KEY: test-only-secret-key-for-ci
        run: pytest -q tests
