name: Remediate npm audit findings

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compatible security updates
        run: |
          npm ci
          npm audit fix
      - name: Verify audit status
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Commit updated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No dependency lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: fix npm audit vulnerabilities"
          git push
